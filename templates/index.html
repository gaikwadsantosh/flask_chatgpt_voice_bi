<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice-To-BI (Vehicle Service Records)</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/recorderjs/0.1.0/recorder.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}?v={{ time.time() }}"> 
    <link rel="stylesheet" href="https://cdn3.devexpress.com/jslib/22.2.5/css/dx.light.css">
    <script src="https://cdn3.devexpress.com/jslib/22.2.5/js/dx.all.js"></script>
</head>
<body>
    <header class="header-strip">
        <h1>Voice-To-BI</h1>
    </header>
    <main class="container">
        <div class="controls">
            <button id="toggleRecord" class="btn btn-primary">Start Recording Command ...</button>
            <div id="loadingIndicator" style="display: none;"></div>
            <audio id="audioPlayback" style="display: none;" controls></audio>
        </div>
        <div id="recognizedText"></div>
        <div id="errorMessageDiv" style="display: none;"></div>
        <div style="margin: 50px 0;"></div> 
    </main>
    <footer>
        © 2024 VoiceToBI | All Rights Reserved
    </footer>
    <script src="{{ url_for('static', filename='script.js') }}?v={{ time.time() }}"></script>
    <script src="{{ url_for('static', filename='charts.js') }}?v={{ time.time() }}"></script>
</body>
</html>
